<ion-header>
  <ion-toolbar color="primary"><ion-title>Deslizador de rango</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-range [(ngModel)]="valor" [min]="0" [max]="100" [pin]="true">
    <ion-label slot="start">0</ion-label>
    <ion-label slot="end">100</ion-label>
  </ion-range>
  <p>Valor: {{ valor }}</p>
</ion-content>

<ion-header>
  <ion-toolbar color="primary"><ion-title>Ventana flotante</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-button id="abrir-popover">Abrir popover</ion-button>

  <ion-popover class="popover-grande" trigger="abrir-popover" [dismissOnSelect]="true">
    <ng-template>
      <ion-content class="ion-padding">
        Esta es una ventana flotante.
      </ion-content>
    </ng-template>
  </ion-popover>
</ion-content>
